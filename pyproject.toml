[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roboot16-amp-project"
version = "0.1.0"
description = "Standalone Roboot16 AMP task package built on top of Isaac Lab."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roboot16_amp_project = [
  "assets/robots/usd/*.usd",
  "assets/robots/usd/configuration/*.usd",
]
